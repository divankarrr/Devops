<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Data</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }
        th {
            background-color: #4CAF50;
            color: white;
        }
        tr:nth-child(even) {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>
    <h1>Student Data Record</h1>
    <table>
        <thead>
            <tr>
                <th>Roll No</th>
                <th>Name</th>
                <th>Department</th>
                <th>GPA</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>1</td>
                <td>Alice Johnson</td>
                <td>Computer Science</td>
                <td>3.8</td>
            </tr>
            <tr>
                <td>2</td>
                <td>Bob Smith</td>
                <td>Mechanical Engineering</td>
                <td>3.5</td>
            </tr>
            <tr>
                <td>3</td>
                <td>Charlie Brown</td>
                <td>Electrical Engineering</td>
                <td>3.9</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
